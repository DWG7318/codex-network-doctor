name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
      - run: go test -race ./...
      - run: go vet ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
      - shell: pwsh
        run: .\scripts\build.ps1 -SkipRace
      - shell: pwsh
        run: |
          .\bin\cnd.exe collect --provider powershell --output .\out\ci-evidence.zip
          .\bin\cnd.exe validate .\out\ci-evidence.zip
